name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # Evita triar pull requests (que también disparan 'issues' en la API de GitHub)
    # y evita el bucle: cuando Claude edita el título del issue, se dispara un nuevo
    # evento 'edited', pero esta vez proviene de un bot, así que se ignora.
    if: ${{ !github.event.issue.pull_request && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ensure triage labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          create() { gh label create "$1" --color "$2" --description "$3" --force; }
          create "area:gameplay"   "1d76db" "Lógica de juego: colisiones, rotación, wall kicks, bloqueo, spawn"
          create "area:rendering"  "5319e7" "Canvas, dibujado, ghost piece, preview de siguiente pieza"
          create "area:input"      "0e8a16" "Teclado, controles, pausa, hard/soft drop"
          create "area:scoring"    "fbca04" "Puntuación, líneas, niveles, velocidad de caída"
          create "area:ui"         "c2e0c6" "HUD, overlay, estilos, layout"
          create "priority:high"   "b60205" "Rompe el juego o bloquea el uso normal"
          create "priority:medium" "ff9f1c" "Molesto pero con workaround"
          create "priority:low"    "d4c5f9" "Cosmético o mejora menor"
          create "triaged"         "ededed" "Ya analizado automáticamente por Claude"

      - name: Triage issue with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowed-tools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Read,Grep,Glob"
          prompt: |
            Eres el triador automático de issues de este repositorio (un Tetris clásico en
            JavaScript vanilla, HTML5 Canvas y CSS, sin dependencias).

            Issue a analizar: #${{ github.event.issue.number }} del repositorio ${{ github.repository }}.

            Sigue al pie de la letra las instrucciones del archivo .github/ISSUE_TRIAGE.md de este
            repositorio: léelo primero por completo y luego ejecuta cada uno de sus pasos en orden
            (leer el issue, investigar el código real citando archivo:línea, etiquetar, normalizar el
            título si hace falta, y publicar o actualizar el comentario de diagnóstico).
